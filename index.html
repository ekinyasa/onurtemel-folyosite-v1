<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onur Temel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #f2efe8;
      font-family: Helvetica, Arial, sans-serif;
    }

    main {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coming-soon {
      width: 33.333vw;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    p {
      margin: 0.7rem 0 0;
      font-size: clamp(0.85rem, 1.2vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .coming-soon {
        width: 66.666vw;
      }

      h1 {
        font-size: clamp(1.8rem, 9vw, 3rem);
      }

      p {
        font-size: clamp(0.75rem, 3.7vw, 1rem);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="coming-soon">
      <h1>ONUR TEMEL</h1>
      <p>yakında | coming soon</p>
    </div>
  </main>
</body>
</html>
