<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONUR TEMEL — Videograf & Arşiv (Test B)</title>
  <meta name="description" content="Videograf Onur Temel'in portfolyosu. Gözlemci belgesel, performans kaydı, kent araştırmaları ve saha dokümantasyonları (Test B).">
  
  <meta property="og:title" content="ONUR TEMEL — Videographer (Test B)">
  <meta property="og:description" content="Portfolio of videographer Onur Temel (Test B).">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="styles.css">
  
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="site-container header-container" id="header-container">
      <a href="#work" class="header-brand" id="brand-link" aria-label="Onur Temel Homepage">ONUR TEMEL</a>
      
      <!-- CENTER ZONE: Filter & Sort toolbar is placed here on wide desktop -->
      <div id="header-center-zone" class="header-center-zone"></div>

      <div class="header-controls" id="header-controls">
        <button id="theme-toggle" class="icon-btn theme-toggle-btn" aria-label="Koyu/Açık temayı değiştir" title="Tema Değiştir">
          <span class="theme-split-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor"/>
            </svg>
          </span>
        </button>

        <button id="lang-toggle" class="icon-btn lang-toggle-btn" aria-label="Switch language to English" title="Dil Değiştir">
          EN
        </button>
        
        <button id="view-switch-btn" class="icon-btn view-switch-btn" aria-label="Metin Görünümünü Göster" aria-expanded="false" title="Görünüm Değiştir">
          <span class="view-switch-symbol" aria-hidden="true">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </button>
      </div>
    </div>

    <!-- SECOND ROW ZONE: Filter & Sort toolbar is placed here in two-row mode / mobile -->
    <div id="second-row-zone" class="second-row-zone">
      <div class="site-container" id="second-row-container">
        <!-- Filter & Sort Controls Bar -->
        <div id="filter-sort-bar" class="filter-sort-bar">
          <!-- Filter Dropdown -->
          <div class="filter-dropdown-container">
            <button id="filter-toggle-btn" class="filter-bar-btn" aria-expanded="false" aria-controls="filter-menu">
              <span id="filter-btn-label">TÜMÜ</span> ▾
            </button>

            <div id="filter-menu" class="filter-menu" hidden>
              <div class="filter-group">
                <h3 class="filter-group-title" id="filter-format-heading">FORMAT</h3>
                <div id="filter-formats-list" class="filter-options-list"></div>
              </div>
              <div class="filter-group">
                <h3 class="filter-group-title" id="filter-category-heading">KATEGORİ</h3>
                <div id="filter-categories-list" class="filter-options-list"></div>
              </div>
              <div class="filter-menu-actions">
                <button id="clear-filters-btn" class="filter-clear-btn">Filtreleri Temizle</button>
              </div>
            </div>
          </div>

          <!-- Sort Dropdown -->
          <div class="sort-dropdown-container">
            <button id="sort-toggle-btn" class="filter-bar-btn" aria-expanded="false" aria-controls="sort-menu">
              <span id="sort-btn-label">SIRALA: EN YENİ</span> ▾
            </button>

            <div id="sort-menu" class="sort-menu" hidden>
              <button class="sort-option-btn active" data-sort="newest">En Yeni</button>
              <button class="sort-option-btn" data-sort="oldest">En Eski</button>
              <button class="sort-option-btn" data-sort="title">Unvan (A–Z)</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="site-container">
    <main>
      <!-- Primary View: Work Grid -->
      <section id="work-view" class="view" aria-label="Seçilmiş Çalışmalar">
        <h1 class="sr-only" id="work-heading">Seçilmiş Çalışmalar</h1>
        <div id="works-grid" class="works-grid" role="region" aria-live="polite"></div>
      </section>

      <!-- Information / Bio / CV View -->
      <section id="info-view" class="view" aria-label="Bilgi & Arşiv" hidden>
        <h1 class="sr-only" id="info-heading">Bilgi & Arşiv</h1>
        <div id="info-container" class="info-container"></div>
      </section>

      <!-- Graceful Fallback Error UI -->
      <div id="error-state" class="error-state" hidden>
        <p id="error-message">İçerik kataloğu yüklenemedi. Lütfen bağlantınızı kontrol edin.</p>
        <button id="retry-btn" class="retry-btn">Yeniden Dene</button>
      </div>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="app.js"></script>
</body>
</html>
